name: generate animation

on:
  # run automatically every 24 hours
  schedule:
    - cron: "0 */24 * * *" 
  
  # allows to manually run the job at any time
  workflow_dispatch:
  
  # run on every push on the main branch
  push:
    branches:
    - main
    
  

jobs:
  generate:
    permissions: 
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 5
    
    steps:
      # generates a snake game from a github user (<github_user_name>) contributions graph, output a svg animation at <svg_out_path>
      - name: generate github-contribution-grid-snake.svg
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-contribution-grid-snake.svg
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark

      # general stats card (replaces github-readme-stats.vercel.app/api)
      - name: generate stats.svg
        uses: lowlighter/metrics@v3.34
        with:
          token: ${{ secrets.METRICS_TOKEN || secrets.GITHUB_TOKEN }}
          user: ${{ github.repository_owner }}
          filename: dist/stats.svg
          output_action: none
          base: header, repositories
          config_timezone: Europe/Paris
          config_display: large
          extras_css: ":root { --color-calendar-graph-day-bg: transparent } .background { fill: transparent }"

      # top languages card (replaces .../api/top-langs)
      - name: generate languages.svg
        uses: lowlighter/metrics@v3.34
        with:
          token: ${{ secrets.METRICS_TOKEN || secrets.GITHUB_TOKEN }}
          user: ${{ github.repository_owner }}
          filename: dist/languages.svg
          output_action: none
          base: ""
          plugin_languages: yes
          plugin_languages_limit: 8
          plugin_languages_sections: most-used
          config_display: large
          extras_css: ".background { fill: transparent }"

      # metrics renders inside its docker volume, not the workspace, so copy the
      # svgs into dist/ before the push step reads it
      - name: collect metrics renders into dist
        run: |
          sudo cp /metrics_renders/dist/*.svg dist/
          sudo chown -R "$(id -u):$(id -g)" dist
          ls -l dist

      # push the content of <build_dir> to a branch
      # the content will be available at https://raw.githubusercontent.com/<github_user>/<repository>/<target_branch>/<file> , or as github page
      - name: push github-contribution-grid-snake.svg to the output branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
